<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 id="shop-name">Loading…</h1>
      <div class="tagline" id="shop-desc"></div>
      <div class="contact" id="shop-contact"></div>
    </div>
    <div class="search-wrap">
      <div class="search-input-wrap">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </span>
        <input id="search-input" type="text" placeholder="Search products…" autocomplete="off" />
      </div>
    </div>
    <div class="categories" id="categories"></div>
  </header>
  <main class="container">
    <div id="content" class="loading">Loading products…</div>
  </main>
  <footer class="footer">
    <div id="footer-info"></div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
